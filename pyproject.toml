[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "divot"
version = "0.1.0"
description = "Pothole detection, IRI mapping, and predictive road-condition modeling"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104",
    "folium>=0.15",
    "lightgbm>=4.1",
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "pandas>=2.1",
    "plotly>=5.18",
    "pyarrow>=14",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "typer>=0.9",
    "ultralytics>=8.1",
    "uvicorn>=0.24",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.25",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
]

[project.scripts]
divot = "divot.cli:app"

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
